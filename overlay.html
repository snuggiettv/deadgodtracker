<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dead God Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --text: #fff4e4; --muted: #d6c4ab; --accent: #e0483c; --gold: #f0c04f; --silver: #c9d1da; --scale: 1; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body {
    color: var(--text); font-family: "Grandstander", "Comic Sans MS", system-ui, sans-serif;
    text-shadow: 0 2px 0 #000, 0 0 6px #000a;
  }
  #wrap { transform: scale(var(--scale)); transform-origin: top left; display: inline-flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 10px; }
  #root { display: inline-block; }
  .bg .pin, .bg #root > * { background: rgba(18, 13, 10, .82); border: 2px solid #3c2e24; border-radius: 14px; box-shadow: 0 6px 20px #0008; }
  .panel { padding: 14px 18px; min-width: 300px; }
  .title { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .big { font-size: 48px; font-weight: 800; line-height: 1; margin: 2px 0 8px; font-variant-numeric: tabular-nums; }
  .big small { font-size: 24px; color: var(--muted); }
  .done .big { color: var(--gold); }
  .bar { height: 12px; background: #000a; border-radius: 99px; overflow: hidden; border: 1px solid #0008; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); transition: width .6s ease; }
  .rows { display: grid; grid-template-columns: auto auto 1fr; gap: 6px 12px; align-items: center; margin-top: 12px; font-size: 18px; }
  .rows .n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .rows .n small { color: var(--muted); font-weight: 500; }
  .rows .bar { height: 8px; min-width: 90px; }
  /* slim bar */
  .slim { display: flex; align-items: center; gap: 14px; padding: 8px 14px; min-width: 520px; font-size: 20px; font-weight: 700; }
  .slim .bar { flex: 1; height: 14px; }
  .slim .pct { font-size: 26px; font-variant-numeric: tabular-nums; }
  .slim .meta { color: var(--muted); font-size: 16px; white-space: nowrap; }
  /* marks grid */
  .grid { padding: 10px 12px; }
  .grid table { border-collapse: separate; border-spacing: 3px; }
  .grid th { font-size: 12px; color: var(--muted); font-weight: 700; padding: 0 2px; }
  .grid th.c { text-align: right; padding-right: 6px; font-size: 13px; }
  .grid tr.t th.c { color: #ff9c93; }
  .grid td { width: 18px; height: 18px; border-radius: 5px; background: #0009; border: 1px solid #ffffff1a; padding: 0; }
  .grid td.l1 { background: var(--silver); border-color: #fff8; }
  .grid td.l2 { background: var(--gold); border-color: #fff8; box-shadow: 0 0 6px #f0c04f88; }
  /* remaining */
  .left .rows { grid-template-columns: 1fr auto; font-size: 17px; }
  .next ul { list-style: none; margin: 8px 0 0; padding: 0; font-size: 19px; display: grid; gap: 6px; }
  .next li { display: flex; gap: 10px; justify-content: space-between; }
  .next li::before { content: "▸"; color: var(--accent); }
  .next li span { flex: 1; }
  .next li small { color: var(--muted); font-variant-numeric: tabular-nums; }
  .tm { font-family: ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .tm.on { color: #9fe07a; }
  .tview { min-width: 260px; }
  .splitv { min-width: 360px; }
  .splitv ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; font-size: 17px; }
  .splitv li, .splitv .stot { display: grid; grid-template-columns: 1fr auto 70px; gap: 10px; align-items: baseline; }
  .splitv li span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .splitv b { font-variant-numeric: tabular-nums; font-weight: 600; }
  .splitv i { font-style: normal; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .splitv i.ahead { color: #6fd08c; } .splitv i.behind { color: #f07a6a; }
  .splitv li.now { color: var(--gold, #e6b84a); border-top: 1px solid #ffffff22; padding-top: 4px; }
  .splitv .stot { margin-top: 6px; font-size: 15px; color: var(--muted); }
  .tview .big { font-size: 54px; margin: 4px 0 0; }
  .runv { min-width: 340px; }
  .runv .rname { font-size: 34px; font-weight: 800; margin: 2px 0 8px; }
  .rcells { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
  .rc { height: 30px; border-radius: 7px; background: #0009; border: 1px solid #ffffff22; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #ffffff88; }
  .rc.l1 { background: var(--silver); color: #222; text-shadow: none; }
  .rc.l2 { background: var(--gold); color: #2b1d00; text-shadow: none; box-shadow: 0 0 6px #f0c04f88; }
  .rfoot { display: flex; justify-content: space-between; gap: 16px; margin-top: 10px; font-size: 18px; color: var(--muted); }
  #root { transition: opacity .45s ease; }
  #root.fade { opacity: 0; }
  /* pinned timer (&pin=top|bottom|tl|tr|bl|br): stays put while views rotate */
  .pin { display: inline-flex; align-items: baseline; gap: 10px; padding: 6px 14px; }
  .pin .lbl { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .pin b { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .pin.corner { position: fixed; margin: 10px; transform: scale(var(--scale)); }
  .pin.tl { top: 0; left: 0; transform-origin: top left; } .pin.tr { top: 0; right: 0; transform-origin: top right; }
  .pin.bl { bottom: 0; left: 0; transform-origin: bottom left; } .pin.br { bottom: 0; right: 0; transform-origin: bottom right; }
  .pin[hidden] { display: none; }
  .pin.below { bottom: auto; margin-top: 8px; } .pin.below.bl { transform-origin: top left; } .pin.below.br { transform-origin: top right; }
  /* viewer page (&page=1) */
  html.page, body.page { overflow: auto; overflow-x: hidden; height: auto; }
  body.page { background: #120d0a; text-shadow: none; }
  .page #wrap { transform: none; display: block; max-width: 760px; margin: 0 auto; padding: 16px; }
  .page #root { display: grid; gap: 14px; width: 100%; }
  .page #root > * { min-width: 0; }
  .page .pagehead { background: none !important; border: 0 !important; box-shadow: none !important; display: flex; justify-content: space-between; align-items: baseline; font-size: 24px; font-weight: 800; color: var(--gold); }
  .page .pagehead small { font-size: 13px; color: var(--muted); font-weight: 600; }
  .page .grid { overflow-x: auto; }
  .page .slim { min-width: 0; flex-wrap: wrap; }
  .wait { color: var(--muted); margin: 8px 0 0; }
  .flash { animation: flash 1.2s ease; }
  @keyframes flash { 0% { filter: brightness(1.8); } 100% { filter: none; } }
</style>
</head>
<body>
<div id="wrap"><div id="root"></div></div>
<script src="data/achievements.js?v=b36288e"></script>
<script src="data/collection.js?v=b36288e"></script>
<script src="js/common.js?v=b36288e"></script>
<script src="js/vendor/nacl.min.js?v=b36288e"></script>
<script src="js/sync.js?v=b36288e"></script>
<script src="data/route.js?v=b36288e"></script>
<script src="js/todo.js?v=b36288e"></script>
<script src="js/overlay.js?v=b36288e"></script>
</body>
</html>
